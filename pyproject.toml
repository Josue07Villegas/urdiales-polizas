[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urdiales-polizas"
version = "0.1.0"
description = "Base académica para centralizar clientes y pólizas de Urdiales Asesores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
urdiales-polizas = "urdiales_polizas.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"urdiales_polizas.persistencia" = ["*.sql"]
